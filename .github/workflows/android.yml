name: Android Build

# Builds a debug APK bundling the current web app (bundled-assets model:
# web changes flow into the next APK automatically). See ANDROID.md.
on:
  pull_request:
    branches:
      - dev
      - stage
      - prod
    paths-ignore:
      - "**.md"
  push:
    branches:
      - dev
      - stage
      - prod
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Web tests + Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      # The web app (and its Vitest suite) is the functional source of truth
      # for the Android app — it must pass before an APK is produced.
      - name: Run Web Tests
        run: bun run test

      - name: Build Static Web Bundle
        run: bun run build:android

      - name: Copy Web Assets into Android Project
        run: ./scripts/copy-web-assets.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onelife-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
